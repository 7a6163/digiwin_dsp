plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "scripts/**/*" # one-off operator scripts, not gem source
    - "vendor/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

# Conflicts with rubyfast (DamirSvrtan/fasterer Rust port):
# rubyfast prefers ENV[] over fetch(key, default) and block form over 2-arg form
# for lazy default evaluation. Honor rubyfast's perf-grounded preferences.
Style/FetchEnvVar:
  Enabled: false
Style/RedundantFetchBlock:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"

Layout/LineLength:
  Max: 140
  Exclude:
    - "spec/**/*"

RSpec/MultipleExpectations:
  Max: 5

RSpec/NestedGroups:
  Max: 4

RSpec/ExampleLength:
  Max: 10

Metrics/MethodLength:
  Max: 15

Metrics/ParameterLists:
  Max: 6

Metrics/ClassLength:
  Max: 150

# Enums is a pure constant catalog mirroring the DSP code tables — its
# length tracks the vendor's enum size, not logic complexity.
Metrics/ModuleLength:
  Exclude:
    - "lib/digiwin_dsp/enums.rb"
