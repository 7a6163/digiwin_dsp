name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: Build + publish to RubyGems
    runs-on: ubuntu-latest

    permissions:
      contents: write   # update / create GitHub Release
      id-token: write   # request OIDC token for RubyGems Trusted Publishing
      packages: write   # publish to GitHub Packages

    steps:
      - uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Run tests (guard against broken releases)
        run: bundle exec rspec

      - name: Build and publish to RubyGems
        uses: rubygems/release-gem@v1

      - name: Publish to GitHub Packages
        run: |
          mkdir -p $HOME/.gem
          touch $HOME/.gem/credentials
          chmod 0600 $HOME/.gem/credentials
          printf -- "---\n:github: ${GEM_HOST_API_KEY}\n" > $HOME/.gem/credentials
          gem build *.gemspec
          gem push --KEY github --host "https://rubygems.pkg.github.com/${OWNER}" *.gem
        env:
          GEM_HOST_API_KEY: "Bearer ${{ secrets.GITHUB_TOKEN }}"
          OWNER: ${{ github.repository_owner }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF_NAME#v}
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — skipping"
            exit 0
          fi
          # Extract the section for [$VERSION] from CHANGELOG.md
          # (from "## [X.Y.Z] ..." up to but not including the next "## [")
          NOTES=$(awk -v v="$VERSION" '
            $0 ~ "^## \\["v"\\]"   { found=1; next }
            found && /^## \[/      { exit }
            found                  { print }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="See [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for changes."
          fi
          # Attach the built gem from pkg/ (rubygems/release-gem writes there)
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "$NOTES" \
            pkg/*.gem
