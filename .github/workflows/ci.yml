name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Lint (RuboCop)
        run: bundle exec rubocop --format github

      - name: Dependency CVE audit (gem-audit)
        if: matrix.ruby == '3.3'
        uses: 7a6163/gem-audit-action@v1

      - name: Tests (RSpec)
        run: bundle exec rspec --format documentation

      - name: Upload coverage to Codecov
        if: matrix.ruby == '3.3'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false
          verbose: true

  mutant:
    name: Mutation testing (changed subjects)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Advisory: mutant fails on any survivor, and ~84 known survivors are
    # message-wording / equivalent mutations. Read the log; don't block merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # --since needs the base branch history

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Mutant (subjects touched since base branch)
        run: bundle exec mutant run --since origin/${{ github.base_ref }}
