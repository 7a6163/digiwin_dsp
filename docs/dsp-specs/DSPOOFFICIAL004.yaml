openapi: 3.1.0
info:
  version: '1.0'
  title: 自有官網 發票更新
  description: 發票更新至DSP，以供ERP至DSP中取得發票資料後，將資料更新至ERP。<BR><font color="red">註：此功能ERP端須要進行個案，才能於ERP系統中查看發票資料。</font>
servers:
  - url: 'https://digiwindsp.digiwin.com/DSP/api/DSP'
    description: 正式區
  - url: 'https://digiwindsp.digiwin.com/DSP_UAT/api/DSP'
    description: 測試區
paths:
  /v1/SalesOrder/invoice:
    post:
      summary: SalesOrder_invoice
      description: ''
      operationId: SalesOrder_invoice
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                digi_header:
                  type: object
                  properties:
                    digi_host:
                      type: object
                      properties:
                        prod:
                          type: string
                          description: 呼叫方代碼
                          example: 'OfficialWebsite'
                        ip:
                          type: string
                          description: 呼叫方 IP
                          example: '111.111.111.111'
                        timestamp:
                          type: string
                          description: 呼叫方時間戳記
                          example: '20251018132542116'
                    digi_service:
                      type: object
                      properties:
                        prod:
                          type: string
                          description: 服務方代碼
                          example: 'DSP'
                        name:
                          type: string
                          description: 服務代碼
                          example: 'salesorder.invoice'
                digi_body:
                  type: object
                  properties:
                    std_data:
                      type: object
                      properties:
                        parameter:
                          type: object
                          properties:
                            request:
                              type: object
                              properties:
                                request_detail:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      platform_id:
                                        type: string
                                        description: 平台唯一識別碼
                                        maxLength: 50
                                        example: '9999'
                                      create_datetime:
                                        type: string
                                        description: |-
                                          建立日期<br>
                                          yyyy-MM-dd HH:mm:ss
                                        maxLength: 20
                                        example: '2022-07-22 13:00:00'
                                      site_no:
                                        type: string
                                        description: 門店代號
                                        maxLength: 11
                                        example: '99999'
                                      form_no:
                                        type: string
                                        description: 官網訂單編號（客戶單號）
                                        maxLength: 128
                                        example: '202207220001'
                                      invoice_no:
                                        type: string
                                        description: 發票號碼
                                        maxLength: 10
                                        example: 'TH12345678'
                                      invoice_date:
                                        type: string
                                        description: |-
                                          發票日期<br>
                                          YYYYMMDD
                                        maxLength: 8
                                        example: '20220722'
                                      invoice_time:
                                        type: string
                                        description: |-
                                          發票時間<br>
                                          HH:MM:SS
                                        maxLength: 8
                                        example: '14:39:22'
                                      invoice_status:
                                        type: string
                                        description: |-
                                          發票狀態<br>
                                          | 代碼 | 說明 |
                                          |-|-|
                                          | 1 | 開立 |
                                          | 2 | 作廢 |
                                          | 3 | 折讓 |
                                          | 4 | 註銷 |
                                          | 5 | 折讓作廢 |
                                        maxLength: 1
                                        example: '1'
                                      invoice_type:
                                        type: string
                                        description: |-
                                          發票類型<br>
                                          | 代號 | 發票類型 |
                                          |---------|----------|
                                          | 1 | 二聯式 |
                                          | 2 | 三聯式 |
                                          | 3 | 二聯式收銀機發票 |
                                          | 4 | 三聯式收銀機發票 |
                                          | 5 | 電子計算機發票 |
                                          | 6 | 免用統一發票 |
                                          | 7 | 電子發票 |
                                          | A | 增值稅專用發票 |
                                          | B | 普通發票 |
                                          | C | 免用發票 |
                                        maxLength: 1
                                        example: '7'
                                      tax_type:
                                        type: string
                                        description: 課稅別
                                        maxLength: 10
                                        example: ''
                                      seller_name:
                                        type: string
                                        description: 賣方名稱
                                        example: '鼎新數智股份有限公司'
                                      seller_address:
                                        type: string
                                        description: 賣方營業地址
                                        example: '新北市新店區中興路一段222號'
                                      buyer_ban:
                                        type: string
                                        description: 買方統一編號
                                        maxLength: 8
                                        example: '87654321'
                                      random_code:
                                        type: string
                                        description: 發票防偽隨機碼
                                        maxLength: 4
                                        example: '1234'
                                      carrier_type:
                                        type: string
                                        description: |-
                                          載具類別<br>
                                          | 代碼 | 說明 |
                                          |-|-|
                                          | 1H0001 | 一卡通 |
                                          | 1K0001 | 悠遊卡 |
                                          | 2G0001 | iCash |
                                          | 3J0002 | 手機條碼 |
                                          | CQ0001 | 自然人憑證 |
                                        maxLength: 6
                                        example: '3J0002'
                                      carrier_showid:
                                        type: string
                                        description: 載具顯碼
                                        example: '/XCCYDHQ'
                                      carrier_hiddenid:
                                        type: string
                                        description: 載具隱碼
                                        example: '/XCCYDHQ'
                                      love_code:
                                        type: string
                                        description: 捐贈碼
                                        example: '12345678'
                                      is_pay:
                                        type: string
                                        description: |-
                                          網購收款狀態<br>
                                          （0：未收款／1:已收款）
                                        maxLength: 1
                                        example: '1'
                                      order_status:
                                        type: string
                                        description: |-
                                          通路平台狀態<br>
                                          (此處請給固定值:5)
                                          |代號|通路平台狀態|
                                          |-|-|
                                          |1|已確認|
                                          |2|已取消|
                                          |3|待出貨|
                                          |4|已出貨|
                                          |5|已開發票|
                                          |6|換貨確認|
                                          |7|退貨確認|
                                        maxLength: 1
                                        example: '5'
                                    required:
                                      - platform_id
                                      - create_datetime
                                      - site_no
                                      - form_no
                                      - invoice_no
                                      - invoice_date
                                      - invoice_time
                                      - invoice_status
                                      - invoice_type
                                      - random_code
                                      - order_status

      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status:
                    type: string
                    description: |-
                      執行結果值：<br>
                      Success - 成功<br>
                      Failure - 失敗
                    example: 'Success'
                  Message:
                    type: string
                    description: |-
                      執行成功請回傳 null。<br>
                      如執行結果失敗，可以此欄位提供錯誤訊息，會出現在前台供檢視。

                      失敗訊息 | 說明 |
                      ---------|----------|
                       Duplicated:發票資料已存在 | 存在相同 form_no + invoice_no + invoice_status 的發票 |
                       SalesNotCreate:銷貨單未成立 | ERP尚未轉銷貨單 |
                       WrongStatus:order_status錯誤，請固定給5(發票更新) | 狀態異常 |
                       系統異常:資料庫存取異常 | DSP程式錯誤 |
                    example: ''
                  response_detail:
                    type: array
                    description: 執行成功將Request中"request_detail"節點內欄位值直接放入傳回，執行失敗將不回傳。
                    items:
                      type: object
                      properties:
                        platform_id:
                          type: string
                          example: '9999'
                        create_datetime:
                          type: string
                          example: '2022-07-22 13:00:00'
                        site_no:
                          type: string
                          example: '99999'
                        form_no:
                          type: string
                          example: '202207220001'
                        invoice_no:
                          type: string
                          example: 'TH12345678'
                        invoice_date:
                          type: string
                          example: '20220722'
                        invoice_time:
                          type: string
                          example: '14:39:22'
                        invoice_status:
                          type: string
                          example: '1'
                        invoice_type:
                          type: string
                          example: '7'
                        tax_type:
                          type: string
                          example: ''
                        seller_name:
                          type: string
                          example: '鼎新數智股份有限公司'
                        seller_address:
                          type: string
                          example: '新北市新店區中興路一段222號'
                        buyer_ban:
                          type: string
                          example: '87654321'
                        random_code:
                          type: string
                          example: '1234'
                        carrier_type:
                          type: string
                          example: '3J0002'
                        carrier_showid:
                          type: string
                          example: '/XCCYDHQ'
                        carrier_hiddenid:
                          type: string
                          example: '/XCCYDHQ'
                        love_code:
                          type: string
                          example: '12345678'
                        is_pay:
                          type: string
                          example: '1'
                        order_status:
                          type: string
                          example: '5'
                required:
                  - Status

      security:
        - ApiKeyAuth: []
      servers:
        - url: 'https://digiwindsp.digiwin.com/DSP/api/DSP'
          description: 正式區
        - url: 'https://digiwindsp.digiwin.com/DSP_UAT/api/DSP'
          description: 測試區
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      description: 由鼎新 DSP 提供 API KEY
      name: DSP-api-key
      in: header
security:
  - ApiKeyAuth: []
