                        random_code: '3'
                        invoice_type: '7'
                        invoice_address: ''
                        invoice_title: ''
                        carrier_code: ''
                        carrier_showid: ''
                        carrier_hiddenid: ''
                        love_code: ''
              examples:
                成功:
                  value:
                    Status: Success
                    Message: null
                    response_detail:
                      - platform_id: '9999'
                        create_datetime: '2022-07-15 13:00:00'
                        site_no: '99999'
